<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentová simulácia</title>
  </head>
  <body>
    <div id="app">
      <div class="page">
        <h1>Agentová simulácia</h1>

        <div class="toolbar">
          <button id="startButton">
            Spustiť
          </button>

          <button id="stopButton">
            Zastaviť
          </button>

          <button id="resetButton">
            Reset
          </button>
        </div>

        <div
          id="simulationContainer"
          class="simulation-container"
        ></div>

        <div class="program-toolbar">
          <button id="loadProgramButton">
            Načítať program
          </button>

          <span id="languageMessage"></span>
        </div>

        <div class="code-panel">
          <h2>Program</h2>

          <textarea
            id="codeEditor"
            spellcheck="false"
          ></textarea>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
